# Nothing here is ignored, and that is the policy rather than an omission.
#
# There was an ignore, briefly, holding the base image to patch releases so
# that the shipped runtime, the floor in wom/runtime.py and the machine this
# is developed on stayed one version. That tidiness is worth less than
# staying current: a held-back version is a number nobody is watching, and
# this repository already learned what those cost. node-version sat at 20
# for four months past its end of life and surfaced as an unrelated jsdom
# bump failing with an error naming neither Node nor a version.
#
# So bumps get taken. When one is red, the first question is whether our
# environment is too old rather than whether the dependency is bad - which
# is what that Node failure turned out to be. An ignore needs a reason
# written next to it.
#
# What this is for is the actions, mostly.
#
# The Python and npm dependencies here are floors rather than pins, so they
# move on their own every time CI installs them - the risk there is not going
# stale, it is moving without anybody looking. The action versions are the
# opposite: actions/checkout@v4 and the flyctl commit below it do not move at
# all, so left alone they age quietly until something is deprecated mid-run.
# That is the gap worth a robot.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    # Both workflows in one pull request. There are four actions across two
    # files; separate PRs for each would be more review than the change.
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"

  # jsdom, and whatever it brings with it. Now that the lockfile is committed
  # a transitive change is a diff somebody can read, which is the whole point
  # of having committed it - this is what surfaces one.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    groups:
      js:
        patterns: ["*"]
    commit-message:
      prefix: "test"

  # The base image in the Dockerfile, which is pinned to a patch release and
  # so is the third thing here that cannot move on its own.
  #
  # Added after the Node pin taught the lesson the cheap way. `node-version`
  # sat at 20 for four months past its end of life, because nothing was
  # watching a number that never changed, and it surfaced as an unrelated
  # dependency bump failing with an error naming neither Node nor a version.
  # python:3.12.14-slim is the same shape of number and would age the same
  # way. 3.12 itself is supported until October 2028; this is about the patch
  # release, and about being told rather than remembering to look.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "build"
