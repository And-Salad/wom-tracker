# The suite, on the interpreters this actually runs on.
#
# 3.10 is the floor wom/runtime.py enforces, and 3.12 is what the Dockerfile
# ships - so those are the two that have to stay green. Between them the
# repository had four hundred tests and nothing that ever ran them.
name: tests

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Debian carries no zone database of its own, and without one every day
      # boundary silently falls back to UTC - which is exactly the failure
      # wom/runtime.py exists to make loud rather than quiet. The tests set
      # real zones and check the offsets, so this is not optional here.
      - name: Install a time zone database
        run: pip install "tzdata>=2024.1"

      - name: Test
        run: pytest

  browser:
    # The 2300 lines of JavaScript the app serves. Its own job, because it
    # needs a runtime nothing else here does - and until now it was the half
    # of the codebase with no tests at all.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-audit --no-fund
      - run: npm test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
