# The suite, on the interpreters this actually runs on.
#
# 3.10 is the floor wom/runtime.py enforces, and 3.12 is what the Dockerfile
# ships - so those are the two that have to stay green. Between them the
# repository had four hundred tests and nothing that ever ran them.
name: tests

on:
  push:
    branches: ["main"]
  pull_request:
  # So the deploy workflow can run these as its gate rather than keeping a
  # second copy of them. A copy is a thing that drifts, and the copy that
  # drifts here is the one deciding whether a commit is fit to ship.
  workflow_call:

# Read-only, written down here rather than left to the repository setting.
# The setting is right today and is not visible in a diff; this is, and the
# deploy workflow calls this file with a Fly token in scope.
permissions:
  contents: read

# A second push to an open pull request supersedes the first rather than
# stacking another full matrix behind it. Never on main: those runs are the
# record of what each commit did, and cancelling one loses that.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # tzdata comes in with this list rather than as a step of its own. It
      # used to be marked Windows-only in requirements.txt, which meant both
      # this file and the Dockerfile had to install it again by hand - the
      # same workaround written in three places, which is one place to change
      # and two to forget. Debian carries no zone database of its own, and
      # without one every day boundary silently falls back to UTC, which is
      # exactly the failure wom/runtime.py exists to make loud rather than
      # quiet. The tests set real zones and check the offsets.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Test
        run: pytest

  browser:
    # The 2300 lines of JavaScript the app serves. Its own job, because it
    # needs a runtime nothing else here does - and until now it was the half
    # of the codebase with no tests at all.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          # Needs the lockfile below to have something to key on.
          cache: npm
      # ci, not install: install resolves the range in package.json afresh on
      # every run, so the suite was never twice the same and nothing that
      # arrived in a transitive dependency was ever reviewed. This job shares
      # a repository with the Fly token.
      - run: npm ci
      - run: npm test

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  image:
    # The deploy builds this on Fly's builder, which is after the checks have
    # gone green and after somebody pressed the button. So a Dockerfile or a
    # requirements.txt that cannot build passed every gate the repository had
    # and failed in the one place where failing is expensive. Building it here
    # costs a minute and moves that discovery back to the pull request.
    #
    # Built, not run: the app wants a volume, a config and network access to
    # Wise Old Man. What is being checked is that the image can be produced at
    # all - which is precisely what the deploy assumes and never verified.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          # A real value, because the empty default is also the "running from
          # a clone" path in wom/build.py and would not exercise the ARG.
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
