# Fly.io deployment for the WOM tracker. One way to host it, not the way:
# the app is a plain Flask process and runs anywhere Python does. See the
# README for the environment variables it reads.
#
# One machine, always on, with a volume for the database. Always on is
# deliberate: the update schedule runs inside this process, and a machine
# that Fly has stopped cannot wake itself to do it.
#
# `fly launch` will rewrite the app name and region for your own account.
app = "wom-tracker"
primary_region = "iad"

[build]

[env]
  WOM_DATA_DIR = "/data"
  # Day boundaries follow the time zone set under Admin regardless of this;
  # it only stops the container printing "next run" times in UTC. Set it to
  # whatever makes the logs easiest to read.
  TZ = "America/New_York"
  # Fly sets this header itself and overwrites anything the caller sent, so
  # it can be believed. Naming it here is what lets the rate limits and the
  # sign-in lockout tell one visitor from another; behind a different proxy,
  # name that proxy's header instead, and behind none, leave it unset.
  WOM_TRUSTED_IP_HEADER = "Fly-Client-IP"

[[mounts]]
  source = "wom_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  # Never stop the machine: stopping it stops the schedule.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
